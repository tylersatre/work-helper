name: Claude Code Review

on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr.outputs.number }}

            You are reviewing a PR in a spec-driven TDD project where all engineering is done by Claude Code agents; Tyler (the product owner) writes specs and acceptance criteria, never code. Your review is consumed by the agent that will push fixes — every finding must be actionable: what is wrong, where (file:line), why it matters, and what a fix looks like. The PR branch is checked out in the working directory.

            Verify, don't hedge. You have a full checkout and npm. Run the verification gate yourself and report real output:
            `npm ci`, then `npm run lint`, `npm run typecheck`, `npm test`, `npm run build`.
            Any failure is a blocking finding — quote the failing output. Never write "I couldn't verify X" for something these commands can verify. To confirm a suspected bug, prefer demonstrating it (a targeted `npx vitest run <file>`, or reasoning from the actual code path) over speculating.

            Review priorities, highest value first:
            1. Real bugs in the changed code: logic errors, missed edge cases, state-transition mistakes, security issues (injection, auth gaps in routes or MCP tools). This matters more than everything below.
            2. Spec conformance: find the feature spec (`docs/product/features/<name>.md` and `specs/<NNN-name>/spec.md`). Every Given/When/Then acceptance criterion must be traceable to at least one test in the diff — name any criterion that has none. Flag implemented behavior that no spec asked for.
            3. Test quality: flag tests that would still pass if the implementation were broken — assertions against mocks of the code under test, trivially-true assertions, tests that don't exercise the behavior their name claims. Flag changed behavior with no covering test. This is how TDD skips are caught here — judge the tests, not the commit history.
            4. Evidence integrity: if the PR description or tasks.md claims browser-tester evidence or verifier sign-off, the bundle must actually exist in the PR under `docs/evidence/<feature>/` (screenshots + results.md). A claimed-but-absent evidence bundle is blocking (constitution Principle III: evidence over assertion).
            5. Constitution and architecture (`.specify/memory/constitution.md`): TypeScript throughout; MCP server on the official `@modelcontextprotocol/sdk` only; email ingestion lives inside the server, never in AI agents; Conventional Commit PR title.

            Do NOT:
            - Flag squashed or single-commit history as a TDD violation. PRs are squash-merged and the clone is shallow; red-before-green is enforced by session hooks and is not reviewable from git history. Priority 3 above is the reviewable proxy.
            - Request data-preserving migrations, backfills, backups, or data-loss warnings. Dev-phase policy (CLAUDE.md, constitution): no real data exists; schema changes may be freely lossy and the dev DB is reset at will. Flagging effort spent on data preservation as unnecessary IS in scope.
            - Narrate everything that was fine. One line per area ("checked X — no issues") is the maximum; spend the words on findings.
            - Restate the spec, the workflow, or the diff back at the reader.
            - Duplicate feedback: first read existing claude[bot] comments (`gh api repos/${{ github.repository }}/issues/${{ steps.pr.outputs.number }}/comments`). On a re-run after new commits, review what changed, mark previously-raised findings that are now fixed as resolved, and don't re-post ones that still stand.

            Output:
            - One inline comment per concrete finding via `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`), each tagged with a severity — `blocking` (bug, failing gate, spec violation, false evidence claim), `should-fix` (real issue, mergeable without), or `nit` — and a concrete suggested fix.
            - One summary comment via `gh pr comment`: gate results (each command, pass/fail), findings ranked by severity with file:line references, and a one-line verdict (ready to merge / fix blocking items first). If there are no findings, the entire summary is a few lines — do not manufacture feedback to justify the review.
            - Only post GitHub comments — never leave review content as plain response text.

          claude_args: |
            --model opus --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh api:*),Bash(npm ci),Bash(npm run lint),Bash(npm run typecheck),Bash(npm run build),Bash(npm test),Bash(npx vitest run:*)"
