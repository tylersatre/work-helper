services:
  work-helper:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${WORK_HELPER_PORT:-8080}:8080"
    environment:
      MCP_TOKEN_SECRET: ${MCP_TOKEN_SECRET:?MCP_TOKEN_SECRET is required — create .env from .env.example}
      AUTHENTIK_USERINFO_URL: ${AUTHENTIK_USERINFO_URL:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
    volumes:
      - ./data:/app/data
      - ./config:/app/config

networks:
  default:
    name: work-helper
