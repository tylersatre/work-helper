services:
  work-helper:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${WORK_HELPER_PORT:-8080}:8080"
    environment:
      CONNECTOR_PASSWORD: ${CONNECTOR_PASSWORD:?CONNECTOR_PASSWORD is required — create .env from .env.example}
    volumes:
      - ./data:/app/data
      - ./config:/app/config

networks:
  default:
    name: work-helper
